name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pushes cancel their in-flight runs — render jobs are
# expensive; don't finish work for a commit that's already obsolete.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Job layout (v0.11.3): one install shared by all jobs, then a fast lane
# and a slow lane that run in parallel. Earlier the unit job ran the
# whole 1500-test suite serially and the 15-min budget was being hit on
# the slowest 2-core runner — the cli package alone has 43 test files
# that each spin up an HTTP server, an ffmpeg subprocess, or both.
# Splitting by package family gives the fast lane enough headroom and
# the slow lane the budget it actually needs.
#
#   install       — shared, ~2 min cold, ~15 s warm with pnpm cache
#   unit-fast     — every non-cli test (most of the suite). ~1-2 min.
#   unit-cli      — every cli test, including the heavy integration
#                   ones that mock the LLM over local HTTP. ~5-8 min.
#   render        — render real videos; the slow lane. ~30 min budget.
#
# unit-fast and unit-cli run in parallel; total CI wall = install + max(
# unit-fast, unit-cli) + render. The shared `setup-pnpm` step primes
# the cache, and the per-job `Cache pnpm store` step reuses it.

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with: {}

      # Warm the pnpm store cache so the unit / render jobs can
      # `restore-keys: pnpm-store-${{ runner.os }}-` on subsequent runs
      # and skip the install step. The cache key hashes pnpm-lock.yaml,
      # so a lockfile change invalidates and re-installs from scratch.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        # Force a clean install every CI run. pnpm can incorrectly report
        # "already up to date" in some fresh-checkout scenarios and skip
        # re-wiring workspace symlinks, which breaks @video/* imports
        # across the package graph. The lockfile still drives
        # reproducible resolution; the wipe just forces link re-wiring.
        run: rm -rf node_modules && pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

  # Fast lane: every test that does NOT spin up a CLI subprocess, an
  # HTTP server, or ffmpeg. Most of the 1500-test suite lives here.
  # ~1-2 min on a 2-core runner. Coverage disabled to keep the v8
  # instrumentation walk from doubling wall time — the ratchet thresholds
  # (lines/statements 80, functions 78, branches 62) live on the
  # `pnpm test` script, not the config, so disabling in CI doesn't
  # loosen the gate. `pnpm test` locally still runs with coverage.
  unit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: rm -rf node_modules && pnpm install

      - name: Non-cli tests
        # Run every test file that is NOT in packages/cli/. The cli
        # package has its own lane because every test file in it spins
        # up an HTTP server or ffmpeg subprocess; running the whole
        # suite on a 2-core box is dominated by setup cost.
        run: >-
          pnpm exec vitest run
          --coverage.enabled=false
          --dir packages
          --exclude 'packages/cli/**'

  # Slow lane: every cli test. cli has 43 test files; each one
  # createServer()s an HTTP mock and shells out to the CLI. 5-8 min
  # on a 2-core runner.
  unit-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        # The cli integration tests don't actually shell out to ffmpeg
        # (they mock it), but several do call into packages/audio-mix
        # which checks for ffmpeg on PATH at module load. Install so
        # the module-init probe doesn't throw.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: rm -rf node_modules && pnpm install

      - name: CLI tests
        # Includes the heavy integration tests (audio-integration,
        # research-integration, review-integration, script-integration,
        # storyboard-integration, youtube-integration, etc.) that spin
        # up local HTTP mocks. The render lane below excludes the ones
        # that rasterize real video.
        run: >-
          pnpm exec vitest run
          --coverage.enabled=false
          --dir packages/cli
          --exclude 'packages/cli/src/pipeline-integration.test.ts'
          --exclude 'packages/cli/src/demo-*.test.ts'

  # Slow lane: the tests and audits that render real video. Budgeted for
  # re-bundling every render on 2-core runners.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: rm -rf node_modules && pnpm install

      - name: Build
        run: pnpm run build

      - name: Render integration tests
        run: >-
          pnpm exec vitest run
          packages/cli/src/pipeline-integration.test.ts
          packages/cli/src/demo-mcp.test.ts
          packages/cli/src/demo-ai-concept.test.ts
          packages/cli/src/demo-devops.test.ts

      - name: §62.4 acceptance audit
        run: |
          # The storyboard approval checkpoint is not part of the committed
          # fixture (only checkpoints/review.yaml is tracked), and a fresh
          # checkout starts ungated — approve explicitly before preview.
          # CI is the automation proxy for the human gate here.
          # Guard: a finished local run may be committed with state.yaml at
          # FINAL_APPROVED, which makes every approve an illegal transition.
          # rewind to ungated first (rewrites state.yaml only — rendered
          # artifacts are untouched).
          node packages/cli/dist/index.js reset --force --cwd projects/benchmark-v01
          node packages/cli/dist/index.js approve storyboard --cwd projects/benchmark-v01
          node packages/cli/dist/index.js preview --cwd projects/benchmark-v01
          # `video approve` takes `[project] [stage]` — omit the stage so it
          # auto-resolves from state.yaml.current_stage (set to `review` by
          # `video preview`). The previous invocation `approve review --cwd`
          # was parsed as `project="review"`, which silently created a
          # non-existent projects/benchmark-v01/projects/review/ root and
          # then failed with "could not determine stage".
          yes | node packages/cli/dist/index.js approve --cwd projects/benchmark-v01
          node packages/cli/dist/index.js final --cwd projects/benchmark-v01
          pnpm run acceptance
