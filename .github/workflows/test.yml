name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      # No pnpm-store cache: a stale global store can hide workspace
      # symlinks and break `@vf/*` imports across the package graph.
      # Install from the committed lockfile (still reproducible) and let
      # pnpm wire workspace symlinks fresh on every CI run.
      - name: Install dependencies
        # Force a clean install on every CI run. pnpm can incorrectly
        # report "already up to date" in some fresh-checkout scenarios and
        # skip re-wiring workspace symlinks, which breaks @vf/* imports
        # across the package graph. The lockfile still drives reproducible
        # resolution; the wipe just forces link re-wiring.
        run: rm -rf node_modules && pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Unit + integration tests
        run: pnpm test

      - name: §62.4 acceptance audit
        run: |
          node packages/cli/dist/index.js preview --cwd projects/benchmark-v01
          yes | node packages/cli/dist/index.js approve review --cwd projects/benchmark-v01
          node packages/cli/dist/index.js final --cwd projects/benchmark-v01
          pnpm run acceptance
