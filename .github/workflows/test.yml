name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pushes cancel their in-flight runs — render jobs are
# expensive; don't finish work for a commit that's already obsolete.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: build, lint, and every test that does not rasterize a
  # video. Render-heavy files (pipeline integration + the three demo
  # tests) run in the `render` job — a single 15-min job covering both
  # classes timed out mid-render once the suite grew past ~600 tests
  # (the "operation was canceled" failure).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version omitted on purpose — pnpm/action-setup reads `packageManager`
        # from package.json automatically. Pinning here causes
        # ERR_PNPM_BAD_PM_VERSION when the two drift.
        with: {}

      - name: Install ffmpeg
        # Use the apt-packaged ffmpeg (Ubuntu 24.04 ships 6.1.1) rather than
        # the johnvansickle static build from FedericoCarboni/setup-ffmpeg.
        # The static 6.1 build has a filter-graph parser bug that rejects
        # our audio-mix graph with "Invalid stream specifier" — see
        # packages/audio-mix/src/mix.ts for the workaround status. apt
        # ffmpeg is built from upstream source and parses the same graph
        # correctly. The pipeline calls ffmpeg only for mix/integration
        # tests; coverage of newer codecs doesn't matter here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      # No pnpm-store cache: a stale global store can hide workspace
      # symlinks and break `@video/*` imports across the package graph.
      # Install from the committed lockfile (still reproducible) and let
      # pnpm wire workspace symlinks fresh on every CI run.
      - name: Install dependencies
        # Force a clean install on every CI run. pnpm can incorrectly
        # report "already up to date" in some fresh-checkout scenarios and
        # skip re-wiring workspace symlinks, which breaks @video/* imports
        # across the package graph. The lockfile still drives reproducible
        # resolution; the wipe just forces link re-wiring.
        run: rm -rf node_modules && pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Unit + non-render tests
        # Same suite as `pnpm test`, minus the files that rasterize real
        # videos (Remotion + Chromium; the bundler cache is disabled by
        # design — determinism — so every render re-bundles).
        run: >-
          pnpm exec vitest run
          --exclude 'packages/cli/src/pipeline-integration.test.ts'
          --exclude 'packages/cli/src/demo-*.test.ts'

  # Slow lane: the tests and audits that render real video. Budgeted for
  # re-bundling every render on 2-core runners.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with: {}

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Install dependencies
        run: rm -rf node_modules && pnpm install

      - name: Build
        run: pnpm run build

      - name: Render integration tests
        run: >-
          pnpm exec vitest run
          packages/cli/src/pipeline-integration.test.ts
          packages/cli/src/demo-mcp.test.ts
          packages/cli/src/demo-ai-concept.test.ts
          packages/cli/src/demo-devops.test.ts

      - name: §62.4 acceptance audit
        run: |
          # The storyboard approval checkpoint is not part of the committed
          # fixture (only checkpoints/review.yaml is tracked), and a fresh
          # checkout starts ungated — approve explicitly before preview.
          # CI is the automation proxy for the human gate here.
          node packages/cli/dist/index.js approve storyboard --cwd projects/benchmark-v01
          node packages/cli/dist/index.js preview --cwd projects/benchmark-v01
          # `video approve` takes `[project] [stage]` — omit the stage so it
          # auto-resolves from state.yaml.current_stage (set to `review` by
          # `video preview`). The previous invocation `approve review --cwd`
          # was parsed as `project="review"`, which silently created a
          # non-existent projects/benchmark-v01/projects/review/ root and
          # then failed with "could not determine stage".
          yes | node packages/cli/dist/index.js approve --cwd projects/benchmark-v01
          node packages/cli/dist/index.js final --cwd projects/benchmark-v01
          pnpm run acceptance
