      **中文文本**：《尚书·尧典》《尚书·皇命》《尚书·泰誓》《尚书·舜典》《尚书·洪范》；《周易·革卦》《周易·系辞》；《论语·尧曰》；《左传》；董仲舒《天人三策》；《史记·五帝本纪》；《汉书·五行志》；《淮南子》。

