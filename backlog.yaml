  - id: 2026-11-19-the-pigeonhole-principle-breaks-a-config
    topic: The Pigeonhole Principle Breaks a Config Table
    status: proposed
    source: harvest:docs/plans/2026-10-26-cross-model-judging-design.md
    created: 2026-11-19
    note: "A classic piece of math silently dictating software architecture; viewers
      love seeing abstract principles force real engineering decisions. — With
