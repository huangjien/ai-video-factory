# AI Video Factory — model ids and provider roles.
#
# Single source of truth. The providers read their model id from this file,
# so retiring or renaming a model is an edit here, not in the provider source.
#   roles  — which provider each pipeline role calls
#   models — which model id that provider serves by default
#
# Precedence, highest first:
#   1. a per-call override (opts.model / req.model)
#   2. OPENAI_MODEL / GEMINI_MODEL (chat only)
#   3. an override file — the LL_CONFIG env var, or a path handed to the
#      loader. It replaces only the keys it names; the rest come from here.
#   4. this file

roles:
  research: { primary: glm, fallback: minimax }
  script: { primary: minimax, fallback: glm }
  storyboard: { primary: minimax, fallback: glm }
  visual: { primary: minimax, fallback: glm }
  motion: { primary: minimax, fallback: glm }
  review: { primary: glm, fallback: minimax }

models:
  # Conversation models: the draft generator pool (openai / gemini / glm),
  # the article judge (minimax), research, scripts, storyboards, reviews.
  chat:
    glm: glm-5.4
    openai: gpt-6.1-sol
    gemini: gemini-3.5-flash
    minimax: MiniMax-M3
  # The Decisions API (typed probability answers), not the chat API — the
  # chat model ids are not available there, and vice versa.
  decision:
    openai: gpt-6-luna
    google: gemini-decision-1
    minimax: MiniMax-M3.1-Flash
  image:
    minimax: image-01
    minimax-h3: MiniMax-H3-Image
    openai: gpt-image-2.6-flare
    gemini: gemini-3.1-flash-image
  video:
    minimax: MiniMax-Hailuo-2.3
  tts:
    minimax: speech-2.8-hd
