schema_version: "0.2"

# Demo 3 — DevOps Architecture (plan §35): 90 seconds, SVG diagram scenes
# with target-driven camera moves (T7.4), mixed transitions, and
# excalidraw asset generation (T7.1). Deterministic: no LLM, no network.

project:
  id: devops-architecture
  language: zh-CN
  fps: 30
  width: 1280
  height: 720

style:
  theme: dark-tech

scenes:
  - id: scene-01
    duration: 15
    narration:
      text: "一次提交，开启整条流水线。"
      audio: "assets/audio/scene-01.wav"
    visual:
      component: Title
      renderer: remotion
      props:
        text: "DevOps 流水线"
        subtext: "从 commit 到生产"
    transition:
      in: fade
      out: cut

  - id: scene-02
    duration: 15
    narration:
      text: "提交触发构建服务器编译与打包。"
      audio: "assets/audio/scene-02.wav"
    visual:
      component: SvgScene
      renderer: svg
      props:
        title: "Commit → Build"
        nodes:
          - id: commit
            kind: circle
            x: 140
            y: 280
            w: 220
            h: 160
            text: "commit"
          - id: build
            kind: rect
            x: 960
            y: 260
            w: 560
            h: 200
            text: "Build Server"
        edges:
          - id: trigger
            from: commit
            to: build
            label: "webhook"
    animations:
      - id: draw-trigger
        target: trigger
        type: draw
        start: 1
        duration: 1.2
        easing: easeInOut
    transition:
      in: cut
      out: cut

  - id: scene-03
    duration: 15
    narration:
      text: "构建产物进入测试环境，自动跑完整测试。"
      audio: "assets/audio/scene-03.wav"
    visual:
      component: SvgScene
      renderer: svg
      props:
        title: "Automated Tests"
        nodes:
          - id: build
            kind: rect
            x: 120
            y: 280
            w: 420
            h: 180
            text: "Build"
          - id: tests
            kind: rect
            x: 1020
            y: 260
            w: 520
            h: 220
            text: "Test Env ✓ ✓ ✓"
        edges:
          - id: promote
            from: build
            to: tests
            label: "artifact"
    animations:
      - id: camera-tests
        target: tests
        type: camera
        start: 4
        duration: 2
        easing: easeInOut
      - id: draw-promote
        target: promote
        type: draw
        start: 1
        duration: 1.2
        easing: easeInOut
    transition:
      in: cut
      out: cut

  - id: scene-04
    duration: 15
    narration:
      text: "测试通过后，发布到三台生产实例。"
      audio: "assets/audio/scene-04.wav"
    visual:
      component: SvgScene
      renderer: svg
      props:
        title: "Deploy to Production"
        nodes:
          - id: gate
            kind: rect
            x: 120
            y: 300
            w: 380
            h: 160
            text: "Tests ✓"
          - id: prod-1
            kind: rect
            x: 1020
            y: 80
            w: 480
            h: 150
            text: "prod-1"
          - id: prod-2
            kind: rect
            x: 1020
            y: 290
            w: 480
            h: 150
            text: "prod-2"
          - id: prod-3
            kind: rect
            x: 1020
            y: 500
            w: 480
            h: 150
            text: "prod-3"
        edges:
          - id: d1
            from: gate
            to: prod-1
          - id: d2
            from: gate
            to: prod-2
          - id: d3
            from: gate
            to: prod-3
    animations:
      - id: camera-prod
        target: prod-2
        type: camera
        start: 5
        duration: 2
        easing: easeInOut
      - id: draw-d1
        target: d1
        type: draw
        start: 1
        duration: 1
        easing: easeInOut
      - id: draw-d2
        target: d2
        type: draw
        start: 2.5
        duration: 1
        easing: easeInOut
      - id: draw-d3
        target: d3
        type: draw
        start: 4
        duration: 1
        easing: easeInOut
    transition:
      in: cut
      out: cut

  - id: scene-05
    duration: 15
    narration:
      text: "监控盯着每一台实例的指标。"
      audio: "assets/audio/scene-05.wav"
    visual:
      component: SvgScene
      renderer: svg
      props:
        title: "Monitor Everything"
        nodes:
          - id: cluster
            kind: rect
            x: 200
            y: 300
            w: 520
            h: 200
            text: "prod cluster"
          - id: metrics
            kind: rect
            x: 1100
            y: 280
            w: 440
            h: 240
            text: "Metrics / Alerts"
        edges:
          - id: feed
            from: cluster
            to: metrics
            label: "telemetry"
    animations:
      - id: camera-metrics
        target: metrics
        type: camera
        start: 3
        duration: 2
        easing: easeInOut
      - id: draw-feed
        target: feed
        type: draw
        start: 1
        duration: 1.4
        easing: easeInOut
    transition:
      in: cut
      out: fade

  - id: scene-06
    duration: 15
    narration:
      text: "绿色通过，部署完成。"
      audio: "assets/audio/scene-06.wav"
    visual:
      component: DoodleScene
      renderer: canvas
      props:
        background: paper
        seed: 77
        strokes:
          - id: pipeline
            shape: zigzag
            x: 640
            y: 320
            size: 90
            color: "#1971c2"
            width: 8
          - id: success
            shape: star
            x: 640
            y: 430
            size: 130
            color: "#3FB68B"
            width: 9
