[project]
name = "flux-klein-worker"
version = "0.1.0"
description = "Local FLUX.2 Klein 4B image worker for @video/media-generators (diffusers + pillow + LoRA)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "diffusers>=0.41.0",
    "transformers>=4.57",
    "accelerate>=1.4",
    "peft>=0.17",
    "safetensors>=0.5",
    "pillow>=11.0",
    "huggingface_hub>=0.34",
    # Optional int8 weight-only quantization for the text encoder
    # (FLUX2_TEXT_ENCODER_QUANT=int8). See T6.3 in
    # docs/v0.5-local-image-generation-plan.md.
    "torchao>=0.18",
]

[dependency-groups]
dev = []
