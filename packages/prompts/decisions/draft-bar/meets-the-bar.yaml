id: meets-the-bar
surface: draft-bar
state: 'A draft that meets the video-essay bar: concrete stakes, dated specifics, a real mechanism, a
  one-sentence takeaway, no template voice. The rubric lands at A — overall score at or above 90, no Critical
  and no Major findings — and passing is true.'
expects:
  kind: choice
  value: pass
source_verdict:
  critical: false
  major_revision_needed: false
  passing: true
policy:
  rule: review-verdict
  note: 'The draft''s own review is the authority: a Critical finding or CRITICAL_BLOCKER rejects, passing
    false revises, passing true passes.'
provenance:
  source: packages/prompts/evals/article-review/perfect-draft-grade-a.yaml — the article the rubric must
    grade A.
