  F-005 (Minor, FACT_OVERCONFIDENCE): The opening premise is stated as historical proof with no source, using absolutes ('没有任何战斗力', '效率也极低').
  F-006 (Minor, LANGUAGE_GRAMMAR): '悦上者荣' misquotes the standard idiom '媚上者荣，悦下者蹇' (fawn on superiors, alienate subordinates).
  F-007 (Moderate, ORIGINALITY_LOW_VALUE): The market model's four roles are named but never mapped to concrete team artefacts or decisions, so the section restates familiar economics without adding information the viewer did not already have.
  F-008 (Minor, ORIGINALITY_TEMPLATE): Nearly every scene's visual repeats the same construction — a raking upper-left light, a soft shadow, and one incidental prop such as dust, paper scraps or a tea stain — producing a visually uniform sequence.

  Overall 72.8, grade C, passing false.
