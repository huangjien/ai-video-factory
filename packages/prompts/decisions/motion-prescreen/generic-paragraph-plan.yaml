id: generic-paragraph-plan
surface: motion-prescreen
state: 'A 6 s Paragraph scene carrying a single quiet closing line. The plan is the default for every
  non-title scene: a fade entrance plus a mid-scene emphasis — the same plan its five neighbouring paragraphs
  get, whether they hold a list, a quotation or a statistic.'
expects:
  kind: choice
  value: refine
baseline: keep
provenance:
  source: packages/motion/src/motion.test.ts — "leaves every other profile on the existing entrance+emphasis
    plan", against "diagram components draw on; terminals write on".
policy:
  rule: motion-specificity
  note: Keep when the plan already matches the scene; refine when it is generic.
