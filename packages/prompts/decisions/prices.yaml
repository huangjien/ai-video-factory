# Provider prices for the decision bench — per 1,000 tokens.
#
# The bench reads this table to fill its cost column. A price that is
# `null` means UNKNOWN, and the bench prints `n/a` for it — never `0`.
# A fabricated zero is how a report ends up claiming a provider is free.
#
# Fill these from the provider's own pricing page, and re-run the bench
# when a price changes. The numbers are per 1,000 tokens; a provider that
# charges per decision (a flat rate) needs its own row, not a token rate.
#
#   schema: decision-prices/1
#   prices:
#     <provider>:
#       <model>:
#         input_per_1k: <number|null>
#         output_per_1k: <number|null>
#
# ── Provenance ────────────────────────────────────────────────────────────
# openai / gpt-6-luna — https://platform.openai.com/docs/pricing
#   (read 2026-11-16) Standard tier, $ per 1M tokens:
#     input $0.10 · output $0.50 · cached input $0.01
#   Per 1k: 0.10/1000 = 0.0001 · 0.50/1000 = 0.0005
#   A decision call reports output_tokens 0 (§6.2 of the v0.11 plan), so a
#   decision costs input tokens only — but the output price stays filled,
#   because a provider that starts emitting output tokens must be priced.
#
# minimax / MiniMax-M3.1-Flash — https://platform.minimax.io/docs/pricing/overview
#   (read 2026-11-16) Standard tier, $ per 1M tokens:
#     input $0.15 · output $0.60 · prompt-caching read $0.015
#   Per 1k: 0.15/1000 = 0.00015 · 0.60/1000 = 0.0006
schema: decision-prices/1
prices:
  openai:
    gpt-6-luna:
      input_per_1k: 0.0001
      output_per_1k: 0.0005
  minimax:
    MiniMax-M3.1-Flash:
      input_per_1k: 0.00015
      output_per_1k: 0.0006
