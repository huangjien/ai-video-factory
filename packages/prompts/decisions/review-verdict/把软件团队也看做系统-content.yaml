  - F006: [moderate] Caption source conflicts between artifacts: storyboard sets every scene's
  captions to derive from narration, while the script defines short title captions per scene (e.g.,
  caption: 越聪明，越难管). Only one source can govern t… (scene-01 vs scene_1)

  - F007: [moderate] Generic placeholder labels 中间处理 and 结果 appear as diagram nodes/levels in four
