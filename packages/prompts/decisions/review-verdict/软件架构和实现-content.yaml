id: 软件架构和实现-content
surface: review-verdict
state: >-
  The content section of a review.


  Fields:

  - accuracy: warn — 未提供 claims 工件（无 video research 运行）。scene-02 引用“维基百科的定义”、scene-05
  将本质/偶然复杂度二分归于《人月神话》、scene-11 描述 AKF 扩展立方体三轴语义，均为事实性断言且无随附来源；按规则仅标记为不可核实，不判定为错误，也未做独立事实核查。

  - logic: ok — 旁白顺序与正文论证一致（定义→复杂性→分治→分层→应用/服务分离→分布式事务→供需关系→抓大放小）；scene-07“模型不消灭复杂性，只降低不确定性”与
  scene-09“不能降低复杂性，只能隔离复杂性”相互呼应且与正文一致；scene-04 与 scene-35 的“一切决策之和”为有意的首尾呼应；未发现因果或结论层面的内部冲突。


  Findings:

  - F001: [moderate] 旁白以“维基百科的定义”作为论证起点，但项目未提供该定义原文或链接，无法核实其拆解（元素与关系两件事）是否忠于出处。 (scene-02)

  - F002: [moderate] 将本质/偶然复杂度二分归于《人月神话》；该区分更常被归于 Brooks
  的《没有银弹》一文（《人月神话》二十周年版收录），归属表述需要核对，且当前无任何来源可查。 (scene-05)

  - F003: [moderate] AKF 扩展立方体三轴语义（X 克隆、Y 拆功能、Z 分数据）及“讲容量扩展而非复杂度拆解”的定性判断均无来源支持，属待核实的事实性内容。
  (scene-11)

  - F004: [minor] 维特根斯坦语录为直接引用却无出处；该句仅存在于正文，未进入旁白，但作为脚本内容仍需核实。 (article.md 第 1 节)

  - F005: [minor] PowerPoint 命名轶事（Gaskins 洗澡灵感、Glenn Hobin 机场海报）虽以“据说”弱化，仍属含人名与情节的具体史实断言，无来源。
  (article.md 第 2 节)

  - F006: [moderate] 四个场景的 visual 组件均为 AnimatedIllustration，但其动画目标使用了 BigIdea/QuoteBlock
  的保留锚点（__reveal__、__quote__、__author__）；若渲染器不为 AnimatedIllustration
  提供这些锚点，四处强调动画将失效。该缺陷在动画配置而非文本，无法通过修改引文修复。 (storyboard scene-08、scene-22、scene-30、scene-33)

  - F007: [minor] script 的 scenes 块与 storyboard 组件声明存在漂移：scene_1 在 component: Title 之外仍保留整段插画提示词，而
  storyboard scene-01 为纯文字 Title；scene_4 的 caption（“架构 = 一切决策之和”）与 storyboard QuoteBlock
  引文（“而架构的过程，是一切决策之和”）不一致；scene_35 也在 BigIdea 组件旁保留沙漏… (article.md scenes 块 scene_1（对照 storyboard
  scene-01）)
expects:
  kind: choice
  value: warn
baseline: warn
source_verdict:
  section_verdict: warn
policy:
  rule: section-verdict
  note:
    The label is DERIVED from the review artifact's own `overall` verdict by the section-verdict
    rule. The loader re-checks that derivation when the case is loaded.
provenance:
  source:
    projects/软件架构和实现/review/content-review.yaml — the review agent's own verdict for the content
    section.
