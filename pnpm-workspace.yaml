packages:
  - "packages/*"
  - "projects/*"

# pnpm 12: approve esbuild's build script (needed for vitest).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - prettier@3.9.9
  - "@vitest/coverage-v8@5.0.3 || 5.0.4"
  - "@vitest/mocker@5.0.3 || 5.0.4"
  - "@vitest/spy@5.0.3 || 5.0.4"
  - vitest@5.0.3 || 5.0.4
  - eslint@10.13.0
